name: Windows Portable Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and test Windows portable package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5 MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5

      - name: Validate generated data
        shell: pwsh
        run: python .\tools\validate_data.py .\data

      - name: Build portable package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build-windows
          qmake MHGUSaveEditor.pro -o build-windows/Makefile
          mingw32-make -C build-windows -j2
          rm -rf dist
          mkdir -p dist
          cp bin/MHGUSaveEditor.exe dist/
          cp -R data dist/data
          cp README.md LICENSE ATTRIBUTION.md dist/
          windeployqt --release --no-translations dist/MHGUSaveEditor.exe

      - name: Build and run core tests
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p tests/build
          qmake tests/CoreTests.pro -o tests/build/Makefile
          mingw32-make -C tests/build -j2
          ./tests/bin/mhgu_core_tests.exe

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\dist\* `
            -DestinationPath .\MHGUSaveEditor-windows-portable.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHGUSaveEditor-windows-portable
          path: MHGUSaveEditor-windows-portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MHGUSaveEditor-windows-portable.zip
